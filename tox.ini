[tox]
requires =
    tox>=4.51.1
    tox-uv-bare
env_list =
    lint,
    mypy-{api,pkg},
    docs-{build,doctests},
    3.1{0-5}{,-pyopenssl}{,-oldest}{,-idna},
    coverage-{combine,report}


[testenv]
runner = uv-venv-runner
package = wheel
wheel_build_env = .pkg
dependency_groups = tests
extras =
    idna: idna
deps =
    pyopenssl: pyopenssl
pass_env =
    FORCE_COLOR
    NO_COLOR
set_env =
    oldest: PIP_CONSTRAINT = tests/constraints/oldest-cryptography.txt
    oldest: UV_CONSTRAINT = tests/constraints/oldest-cryptography.txt
    pyopenssl-oldest: PIP_CONSTRAINT = tests/constraints/oldest-pyopenssl.txt
    pyopenssl-oldest: UV_CONSTRAINT = tests/constraints/oldest-pyopenssl.txt
commands =
    coverage run -m pytest {posargs}
    py312-pyopenssl-latest-idna: coverage run -m pytest --doctest-modules --doctest-glob='*.rst' {posargs}


# Split combine/report in 2 to avoid excessive "Combined data file ..." output.
[testenv:coverage-combine]
base_python_file = .python-version-default
depends = 3.*
package = skip
deps = coverage
commands = coverage combine


[testenv:coverage-report]
base_python_file = .python-version-default
depends = coverage-combine
parallel_show_output = true
package = skip
deps = coverage
commands = coverage report


[testenv:lint]
package = skip
deps = prek
commands = prek run --all-files {posargs}


[testenv:mypy-api]
dependency_groups = mypy
commands = mypy tests/typing docs/pyopenssl_example.py


[testenv:mypy-pkg]
dependency_groups = mypy
commands = mypy src


[testenv:docs-{build,doctests,linkcheck}]
base_python_file = .python-version-default
dependency_groups = docs
commands =
    # N.B. doctests is not a nitpicky as build -- we need to run both in CI!
    build: sphinx-build -n -T -W -b html -d {envtmpdir}/doctrees docs {posargs:docs/_build/}html
    doctests: sphinx-build -n -T -W -b doctest -d {envtmpdir}/doctrees docs {posargs:docs/_build/}html
    linkcheck: sphinx-build -W -b linkcheck -d {envtmpdir}/doctrees docs docs/_build/html

[testenv:docs-watch]
package = editable
base_python = {[testenv:docs-build]base_python}
dependency_groups = {[testenv:docs-build]dependency_groups}
deps = watchfiles
commands =
    watchfiles \
        --ignore-paths docs/_build/ \
        'sphinx-build -W -n --jobs auto -b html -d {envtmpdir}/doctrees docs docs/_build/html' \
        src \
        docs
